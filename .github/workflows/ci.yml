name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run eval:replay -- --suite all

  # Headline regen drift (~5 min wall locally). Kept off verify so PRs stay fast.
  # --dangerouslyIgnoreUnhandledErrors: vitest birpc times out onTaskUpdate when a
  # single CPU-bound drift test blocks the worker >60s; assertions still pass.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot / discrimination / bench drift guards
        env:
          SNAPSHOT_DRIFT: "1"
        run: >
          npx vitest run --dangerouslyIgnoreUnhandledErrors
          --testTimeout=600000
          -t "drift-guard"
          src/__tests__/eval-pivotal-snapshots.test.ts
          src/__tests__/eval-adversarial-snapshots.test.ts
          src/__tests__/eval-discriminate.test.ts
          src/__tests__/eval-bench-mode.test.ts
