name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Build with Pages base path
        env:
          VITE_BASE: /robot-agent-arena/
        run: npm run build
      - name: Assert Pages asset prefix in dist
        run: |
          grep -q '/robot-agent-arena/' dist/index.html
      - name: Protected paths and lockfile unchanged vs PR base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            echo "Comparing protected paths two-dot against PR base $BASE"
            git diff --exit-code "$BASE"..HEAD -- \
              src/engine \
              src/agent/prompt.ts \
              src/agent/prompt-batch4.ts \
              evals/fixtures \
              src/ui/lab/pack/decision-lab.v3.json \
              src/ui/arena/pack/arena-replay.v1.json \
              src/ui/lab/pack/diagnostics.summary.json \
              evals/out-committed/bench.summary.json \
              evals/out-committed/batch4.robustness.summary.json \
              src/ui/data/batch4.robustness.summary.json \
              src/ui/data/leaderboard.v1.json \
              evals/env-suites/resonance-seal/snapshots.resonance-seal.v1.json \
              evals/out-committed/resonance-seal.baselines.v1.json \
              evals/out-committed/adversarial.baselines.json \
              evals/out-committed/adversarial.heldout-ext.baselines.json \
              evals/out-committed/batch4.phase2.marker.json \
              evals/out-committed/bench.live-profile.json \
              evals/out-committed/diagnostics.summary.json \
              evals/out-committed/discriminate.summary.json \
              src/ui/arena/pack/schema.ts \
              src/ui/data/quickstart-robot.ts \
              src/__tests__/env-robot.test.ts \
              src/__tests__/eval-snapshots.test.ts \
              src/__tests__/env-differential.test.ts \
              src/decision-lab/diagnostics.ts \
              src/eval/lab-pack.ts \
              package.json \
              package-lock.json
          else
            echo "push event: skipping protected-path PR-base check (no pull_request.base.sha)"
          fi
      - name: Dist URL allowlist (OpenRouter API only)
        run: node scripts/check-dist-urls.mjs
      - run: npm run coverage
      - run: npm run eval:replay -- --suite all --models gemini:gemini-3.5-flash-lite
      - run: npm run eval:replay -- --suite heldout --snapshot-suite adversarial --variants base,grounded,freetext --max-matches 0 --models groq:openai/gpt-oss-20b
      - run: npm run eval:replay -- --suite heldout --snapshot-suite adversarial-heldout-ext --variants base,grounded --max-matches 0 --models groq:openai/gpt-oss-20b
      - run: npm run eval:replay -- --suite heldout --snapshot-suite adversarial-heldout-ext --variants base-repeat,perturb,advctx,info-partial --max-matches 0 --models gemini:gemini-3.5-flash-lite
      - run: npm run eval:replay -- --suite heldout --snapshot-suite adversarial-heldout-ext --variants base-repeat,perturb,advctx,info-partial --max-matches 0 --models groq:openai/gpt-oss-20b

  # Headline regen drift (~5 min wall locally). Kept off verify so PRs stay fast.
  # Per-file steps (issue #28). Forks + maxWorkers=1 tried as root fix for vitest
  # "Timeout calling onTaskUpdate"; heldout-ext + discriminate still exit 1 with
  # Errors 1 after assertions pass — keep --dangerouslyIgnoreUnhandledErrors on
  # those two steps ONLY (issue #28 remains open; see D-049).
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Drift — eval-snapshots
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 -t "drift-guard" src/__tests__/eval-snapshots.test.ts
      - name: Drift — eval-pivotal-snapshots
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 -t "drift-guard" src/__tests__/eval-pivotal-snapshots.test.ts
      - name: Drift — eval-adversarial-snapshots
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 -t "drift-guard" src/__tests__/eval-adversarial-snapshots.test.ts
      - name: Drift — eval-heldout-ext-snapshots
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 --dangerouslyIgnoreUnhandledErrors -t "drift-guard" src/__tests__/eval-heldout-ext-snapshots.test.ts
      - name: Drift — eval-discriminate
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 --dangerouslyIgnoreUnhandledErrors -t "drift-guard" src/__tests__/eval-discriminate.test.ts
      - name: Drift — eval-bench-mode
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 -t "drift-guard" src/__tests__/eval-bench-mode.test.ts
      - name: Drift — env-differential
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 -t "drift-guard" src/__tests__/env-differential.test.ts
      - name: Drift — batch4
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 src/__tests__/batch4-drift.test.ts
      - name: Drift — resonance-seal suite
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 src/__tests__/resonance-seal-suite-drift.test.ts
      - name: Drift — resonance-seal baselines
        env:
          SNAPSHOT_DRIFT: "1"
        run: npx vitest run --pool=forks --maxWorkers=1 --testTimeout=600000 src/__tests__/resonance-seal-baselines-drift.test.ts
